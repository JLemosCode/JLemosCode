name: Update Profile

on:
schedule:
- cron: "0 3 * * *"

workflow_dispatch:

permissions:
contents: write

jobs:

update:

```
runs-on: ubuntu-latest

steps:

  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Generate profile
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |
      echo "Updating profile..."

      # Future:
      # - GitHub GraphQL API
      # - Contributions
      # - Followers
      # - Repositories
      # - Stars
      # - Activity

  - name: Commit changes
    run: |

      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add assets/

      git diff --cached --quiet || \
      git commit -m "chore: update profile"

      git push
```
