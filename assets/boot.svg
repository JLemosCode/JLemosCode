<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260">
<defs>
<style>
@keyframes flicker{0%,18%,22%,63%,64%,65%,100%{opacity:1}20%,62%{opacity:.72}21%,64%{opacity:.88}}
@keyframes cursor{0%,48%{opacity:1}49%,100%{opacity:0}}
@keyframes scan{from{transform:translateY(-260px)}to{transform:translateY(260px)}}
@keyframes boot{from{width:0}to{width:100%}}
.t{font-family:monospace;fill:#d8d8d8}.dim{fill:#777}.accent{fill:#f1f1f1}
</style>
<linearGradient id="bg" x2="0" y2="1"><stop stop-color="#090a0c"/><stop offset="1" stop-color="#15171a"/></linearGradient>
<pattern id="lines" width="4" height="6" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="2" y="2" width="1196" height="256" rx="16" fill="url(#bg)" stroke="#555"/>
<rect x="3" y="3" width="1194" height="254" rx="15" fill="url(#lines)"/>
<text x="38" y="38" class="t" font-size="13">JLemosCode BIOS v2.0 // PROFILE TERMINAL</text>
<text x="38" y="86" class="t accent" font-size="35" filter="url(#glow)">JORGE LEMOS</text>
<text x="40" y="116" class="t dim" font-size="15">FULL STACK DEVELOPER / FRONTEND SPECIALIST</text>
<text x="40" y="153" class="t" font-size="13">initializing developer profile...</text>
<rect x="40" y="166" width="620" height="8" rx="4" fill="#24272a"/>
<rect x="40" y="166" width="620" height="8" rx="4" fill="#bcbcbc">
 <animate attributeName="width" from="0" to="620" dur="2.2s" fill="freeze"/>
</rect>
<text x="40" y="202" class="t dim" font-size="12">18+ YEARS / WEB / SOFTWARE / PRODUCT / ARCHITECTURE</text>
<text x="40" y="230" class="t" font-size="13">STATUS: ONLINE <tspan fill="#aaa">█</tspan><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></text>
<g transform="translate(930 135)">
<rect x="-95" y="-72" width="190" height="144" rx="8" fill="#0c0d0f" stroke="#444"/>
<text x="0" y="-38" text-anchor="middle" class="t dim" font-size="11">SYSTEM CLASS</text>
<text x="0" y="-4" text-anchor="middle" class="t" font-size="27">FULL STACK</text>
<text x="0" y="28" text-anchor="middle" class="t dim" font-size="11">LVL 18+</text>
<text x="0" y="54" text-anchor="middle" class="t" font-size="10">READY FOR NEXT QUEST</text>
</g>
<rect x="0" y="0" width="1200" height="2" fill="#fff" opacity=".12">
 <animateTransform attributeName="transform" type="translate" from="0 -20" to="0 280" dur="4s" repeatCount="indefinite"/>
</rect>
</svg>