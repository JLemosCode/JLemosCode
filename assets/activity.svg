<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
<defs>
<style>
@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
@keyframes sweep{from{transform:translateX(-30px)}to{transform:translateX(1130px)}}
.t{font-family:monospace;fill:#d4d4d4}.dim{fill:#777}
</style>
<linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0b0c0e"/><stop offset="1" stop-color="#17191c"/></linearGradient>
</defs>
<rect x="2" y="2" width="1196" height="296" rx="16" fill="url(#bg)" stroke="#4d4f52"/>
<text x="35" y="40" class="t" font-size="13">GITHUB MONITOR // LIVE PROFILE DATA</text>
<text x="35" y="82" class="dim" font-size="11">This panel is generated by GitHub Actions.</text>
<g id="data">
<text x="35" y="130" class="t" font-size="26">CONTRIBUTIONS</text>
<text id="contributions" x="35" y="165" class="t" font-size="24">--</text>
<text x="280" y="130" class="t" font-size="26">REPOSITORIES</text>
<text id="repos" x="280" y="165" class="t" font-size="24">--</text>
<text x="525" y="130" class="t" font-size="26">FOLLOWERS</text>
<text id="followers" x="525" y="165" class="t" font-size="24">--</text>
<text x="770" y="130" class="t" font-size="26">COMMITS</text>
<text id="commits" x="770" y="165" class="t" font-size="24">--</text>
</g>
<line x1="35" y1="205" x2="1165" y2="205" stroke="#393c3f"/>
<text x="35" y="240" class="dim" font-size="11">last update:</text>
<text id="updated" x="120" y="240" class="t" font-size="11">waiting for GitHub Actions...</text>
<text x="35" y="270" class="dim" font-size="11">monitor</text>
<text x="95" y="270" class="t" font-size="11">[</text><rect x="108" y="259" width="40" height="12" fill="#bdbdbd"><animate attributeName="x" from="108" to="1080" dur="2.8s" repeatCount="indefinite"/></rect><text x="1130" y="270" class="t" font-size="11">]</text>
</svg>