<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410">
<defs>
<style>
@keyframes type{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
@keyframes scan{from{transform:translateY(-410px)}to{transform:translateY(410px)}}
.t{font-family:monospace;fill:#d2d2d2}.dim{fill:#777}.bright{fill:#f4f4f4}.muted{fill:#a5a5a5}
</style>
<linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0a0b0d"/><stop offset="1" stop-color="#17191c"/></linearGradient>
<pattern id="scan" width="4" height="8" patternUnits="userSpaceOnUse"><path d="M0 0H4" stroke="#fff" opacity=".035"/></pattern>
</defs>
<rect x="2" y="2" width="1196" height="406" rx="16" fill="url(#bg)" stroke="#4d4f52"/>
<rect x="3" y="3" width="1194" height="404" rx="15" fill="url(#scan)"/>
<rect x="28" y="28" width="1144" height="354" rx="10" fill="#08090a" stroke="#34373a"/>
<circle cx="54" cy="51" r="6" fill="#666"/><circle cx="75" cy="51" r="6" fill="#444"/><circle cx="96" cy="51" r="6" fill="#333"/>
