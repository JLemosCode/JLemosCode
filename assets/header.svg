<svg width="1200" height="360" viewBox="0 0 1200 360"
  xmlns="http://www.w3.org/2000/svg">

<defs>

```
<filter id="glow">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
    </feMerge>
</filter>

<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0d0f0d"/>
    <stop offset="50%" stop-color="#111411"/>
    <stop offset="100%" stop-color="#0d0f0d"/>
</linearGradient>

<pattern id="scanlines"
         width="4"
         height="8"
         patternUnits="userSpaceOnUse">

    <line x1="0" y1="0"
          x2="1200" y2="0"
          stroke="#ffffff"
          stroke-opacity=".025"/>

</pattern>
```

</defs>

