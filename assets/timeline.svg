<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230">
<defs><style>
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.t{font-family:monospace;fill:#d0d0d0}.dim{fill:#777}.line{stroke:#555}
</style></defs>
<rect x="2" y="2" width="1196" height="226" rx="16" fill="#101214" stroke="#4d4f52"/>
<text x="35" y="40" class="t" font-size="13">CAREER TIMELINE // EXPERIENCE LOG</text>
<line x1="70" y1="118" x2="1130" y2="118" class="line" stroke-width="2"/>
<g font-family="monospace">
<circle cx="150" cy="118" r="8" fill="#aaa"><animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/></circle>
<text x="150" y="92" text-anchor="middle" class="dim" font-size="12">2017+</text>
<text x="150" y="150" text-anchor="middle" class="t" font-size="12">SYSTEMS</text>
<text x="150" y="171" text-anchor="middle" class="dim" font-size="10">integration</text>

<circle cx="405" cy="118" r="8" fill="#aaa"/>
<text x="405" y="92" text-anchor="middle" class="dim" font-size="12">2018–2023</text>
<text x="405" y="150" text-anchor="middle" class="t" font-size="12">FULL STACK</text>
<text x="405" y="171" text-anchor="middle" class="dim" font-size="10">senior / leadership</text>

<circle cx="690" cy="118" r="8" fill="#aaa"/>
<text x="690" y="92" text-anchor="middle" class="dim" font-size="12">2023+</text>
<text x="690" y="150" text-anchor="middle" class="t" font-size="12">PRODUCTS</text>
<text x="690" y="171" text-anchor="middle" class="dim" font-size="10">full stack / frontend</text>

<circle cx="1015" cy="118" r="8" fill="#eee"><animate attributeName="opacity" values=".35;1;.35" dur="1.5s" repeatCount="indefinite"/></circle>
<text x="1015" y="92" text-anchor="middle" class="dim" font-size="12">NOW</text>
<text x="1015" y="150" text-anchor="middle" class="t" font-size="12">NEXT LEVEL</text>
<text x="1015" y="171" text-anchor="middle" class="dim" font-size="10">AI / product / scale</text>
</g>
</svg>